# Managed by the sync-configuration ansible role. Enables the node_exporter
# textfile collector so status exports (sync-configuration, SMART on soy)
# are served from /var/lib/node_exporter/textfile_collector. The original
# ExecStart command is preserved below.
[Service]
ExecStart=
ExecStart={{ ne_execstart_cmd }} --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
